name: Desktop installers

on:
    push:
        tags: ["desktop-v*"]
    workflow_dispatch:
        inputs:
            version:
                description: Release tag to create/update (e.g. desktop-v0.21.0)
                required: false

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-14
                      artifact: mac
                    - os: windows-latest
                      artifact: win
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - name: Resolve version from tag
              id: version
              shell: bash
              run: |
                  raw="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
                  case "$raw" in
                    desktop-v[0-9]*) ;;
                    *) echo "tag must look like desktop-vX.Y.Z (got '$raw')"; exit 1 ;;
                  esac
                  version="${raw#desktop-v}"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  # The renderer reads VERSION at build time and the Electron shell reads
                  # package.json, so both must carry the tag's version for update checks.
                  printf 'v%s\n' "$version" > VERSION
                  node -e "const fs=require('fs');const p='desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" "$version"
                  cat VERSION
                  node -p "require('./desktop/package.json').version"

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install web deps
              working-directory: web
              run: pnpm install --no-frozen-lockfile

            - name: Build renderer
              working-directory: web
              run: pnpm build

            - name: Install desktop deps
              working-directory: desktop
              run: pnpm install --no-frozen-lockfile

            - name: Build macOS installers
              if: matrix.artifact == 'mac'
              working-directory: desktop
              run: pnpm exec electron-builder --mac dmg --arm64 --x64 --publish never

            - name: Build Windows installer
              if: matrix.artifact == 'win'
              working-directory: desktop
              run: pnpm exec electron-builder --win nsis --x64 --publish never

            - name: Verify macOS installer
              if: matrix.artifact == 'mac'
              working-directory: desktop
              run: |
                  set -e
                  dmg="$(ls release/*arm64.dmg | head -1)"
                  echo "checking $dmg"
                  hdiutil attach "$dmg" -mountpoint /tmp/icmnt -nobrowse -quiet
                  test -f "/tmp/icmnt/Infinite Canvas.app/Contents/Resources/renderer/index.html"
                  test -f "/tmp/icmnt/Infinite Canvas.app/Contents/Resources/proxy/server.js"
                  test -f "/tmp/icmnt/Infinite Canvas.app/Contents/Resources/app.asar"
                  du -sh "/tmp/icmnt/Infinite Canvas.app"
                  hdiutil detach /tmp/icmnt -quiet

            - name: Verify Windows installer offers a directory page
              if: matrix.artifact == 'win'
              working-directory: desktop
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  $setup = (Get-ChildItem release/*.exe | Select-Object -First 1).FullName
                  Write-Host "launching $setup"

                  # NSIS draws a classic Win32 wizard, which the UIAutomation bridge barely
                  # exposes, so walk it with plain user32 calls and read control texts.
                  Add-Type @"
                  using System;
                  using System.Collections.Generic;
                  using System.Runtime.InteropServices;
                  using System.Text;
                  public class NsisWizard {
                      public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
                      [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc cb, IntPtr l);
                      [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr parent, EnumProc cb, IntPtr l);
                      [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint pid);
                      [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowTextW(IntPtr hWnd, StringBuilder s, int n);
                      [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassNameW(IntPtr hWnd, StringBuilder s, int n);
                      [DllImport("user32.dll")] static extern IntPtr GetDlgItem(IntPtr hDlg, int id);
                      [DllImport("user32.dll")] static extern IntPtr SendMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);
                      [DllImport("user32.dll", CharSet=CharSet.Unicode, EntryPoint = "SendMessageW")] static extern IntPtr SendMessageText(IntPtr h, uint msg, IntPtr w, StringBuilder l);
                      [DllImport("user32.dll")] static extern int GetDlgCtrlID(IntPtr h);
                      static string Text(IntPtr h) {
                          var sb = new StringBuilder(1024);
                          GetWindowTextW(h, sb, sb.Capacity);
                          return sb.ToString();
                      }
                      static string Cls(IntPtr h) {
                          var sb = new StringBuilder(256);
                          GetClassNameW(h, sb, sb.Capacity);
                          return sb.ToString();
                      }
                      public static IntPtr FindMain(uint pid) {
                          IntPtr found = IntPtr.Zero;
                          EnumWindows((h, l) => {
                              uint owner;
                              GetWindowThreadProcessId(h, out owner);
                              if (owner == pid && Cls(h) == "#32770" && Text(h).Length > 0) {
                                  found = h;
                                  return false;
                              }
                              return true;
                          }, IntPtr.Zero);
                          return found;
                      }
                      public static List<string> Children(IntPtr parent) {
                          var list = new List<string>();
                          EnumChildWindows(parent, (h, l) => {
                              list.Add(GetDlgCtrlID(h) + "|" + Cls(h) + "|" + Text(h));
                              return true;
                          }, IntPtr.Zero);
                          return list;
                      }
                      // NSIS nests each page's controls inside a child dialog, so controls
                      // are looked up among all descendants rather than direct children.
                      public static IntPtr Descendant(IntPtr parent, int id) {
                          IntPtr found = IntPtr.Zero;
                          EnumChildWindows(parent, (h, l) => {
                              if (GetDlgCtrlID(h) == id) {
                                  found = h;
                                  return false;
                              }
                              return true;
                          }, IntPtr.Zero);
                          return found;
                      }
                      // GetWindowText does not reach controls owned by another process,
                      // WM_GETTEXT does, so the path in the edit box has to be asked for.
                      public static string ControlText(IntPtr parent, int id) {
                          var control = Descendant(parent, id);
                          if (control == IntPtr.Zero) return "";
                          var sb = new StringBuilder(1024);
                          SendMessageText(control, 0x000D /* WM_GETTEXT */, (IntPtr)sb.Capacity, sb);
                          return sb.ToString();
                      }
                      public static bool ClickButton(IntPtr parent, int id) {
                          var button = Descendant(parent, id);
                          if (button == IntPtr.Zero) return false;
                          SendMessage(button, 0x00F5 /* BM_CLICK */, IntPtr.Zero, IntPtr.Zero);
                          return true;
                      }
                      public static void Close(IntPtr parent) {
                          SendMessage(parent, 0x0010 /* WM_CLOSE */, IntPtr.Zero, IntPtr.Zero);
                      }
                  }
                  "@

                  $proc = Start-Process -FilePath $setup -PassThru
                  $wizard = [IntPtr]::Zero
                  for ($i = 0; $i -lt 40 -and $wizard -eq [IntPtr]::Zero; $i++) {
                      Start-Sleep -Seconds 1
                      $wizard = [NsisWizard]::FindMain([uint32]$proc.Id)
                  }
                  if ($wizard -eq [IntPtr]::Zero) { throw "installer window never appeared" }

                  # NSIS page headings carry ids 1037 (title) and 1038 (subtitle). The
                  # directory page is the one headed "Choose Install Location".
                  $dirValue = $null
                  $title = ""
                  $pageHit = $false
                  $browse = ""
                  for ($page = 0; $page -lt 5 -and -not $pageHit; $page++) {
                      $title = [NsisWizard]::ControlText($wizard, 1037)
                      $subtitle = [NsisWizard]::ControlText($wizard, 1038)
                      Write-Host "page $page : $title / $subtitle"
                      if ($title -match 'Installing|正在安装') { throw "the wizard installed without offering an install directory" }
                      if ($title -match 'Install Location|安装位置' -or $subtitle -match 'in which to install|安装到') {
                          $pageHit = $true
                          $dirValue = [NsisWizard]::ControlText($wizard, 1019)
                          $browse = [NsisWizard]::ControlText($wizard, 1001)
                          break
                      }
                      [void][NsisWizard]::ClickButton($wizard, 1)
                      Start-Sleep -Seconds 2
                  }
                  [NsisWizard]::Close($wizard) | Out-Null
                  Start-Sleep -Seconds 3
                  Get-Process | Where-Object { $_.ProcessName -like 'Infinite-Canvas-Setup*' } | Stop-Process -Force
                  if (-not $pageHit) { throw "installer never showed an install location page" }
                  # A path we can read, or the Browse button next to it, both prove the
                  # wizard lets the user pick the folder instead of hardcoding one.
                  if (-not ($dirValue -match 'Infinite Canvas') -and -not $browse) { throw "install location page had neither an editable path nor a browse button" }
                  Write-Host "install location page found, default path: '$dirValue', browse button: '$browse'"
                  Write-Host "installer closed before copying any file"

            - name: Verify Windows installer
              if: matrix.artifact == 'win'
              working-directory: desktop
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  $setup = Get-ChildItem release/*.exe | Select-Object -First 1
                  Write-Host "installing $($setup.FullName)"
                  Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
                  $appDir = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory -Recurse -Depth 2 -ErrorAction SilentlyContinue |
                      Where-Object { Test-Path (Join-Path $_.FullName "resources\app.asar") } | Select-Object -First 1
                  if (-not $appDir) { throw "installed app directory not found" }
                  Write-Host "installed at $($appDir.FullName)"
                  foreach ($p in @("resources\renderer\index.html", "resources\proxy\server.js", "resources\app.asar")) {
                      if (-not (Test-Path (Join-Path $appDir.FullName $p))) { throw "missing $p" }
                  }
                  Get-ChildItem $appDir.FullName | Select-Object Name

            - uses: actions/upload-artifact@v4
              with:
                  name: installers-${{ matrix.artifact }}
                  path: |
                      desktop/release/*.dmg
                      desktop/release/*.exe
                  if-no-files-found: error

    release:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - name: List installers
              run: ls -lh dist

            - uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
                  name: Infinite Canvas ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
                  body_path: desktop/RELEASE_NOTES.md
                  files: dist/*
                  fail_on_unmatched_files: true
